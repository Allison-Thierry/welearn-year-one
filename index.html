<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061014">
  <meta name="description" content="The WeLearn Year One celebration has ended. See you next year.">
  <title>WeLearn — See you next year</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Sora"; src: url("assets/fonts/sora-400.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Sora"; src: url("assets/fonts/sora-600.ttf") format("truetype"); font-weight: 600; font-display: swap; }

    :root {
      color-scheme: dark;
      --ink: #061014;
      --paper: #f5f2ec;
      --muted: #aab4b5;
      --red: #dc263f;
      --light: #f6cb69;
      --light-pale: #fff1bd;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; background: var(--ink); }

    body {
      overflow: hidden;
      color: var(--paper);
      font-family: Helvetica, Arial, system-ui, sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      content: "";
      background:
        radial-gradient(circle at 50% 42%, rgba(246, 203, 105, 0.12), transparent 21rem),
        radial-gradient(circle at 50% 0%, rgba(29, 65, 83, 0.58), transparent 42rem),
        linear-gradient(180deg, #071216, var(--ink));
      animation: room-breathe 6s ease-in-out infinite;
    }

    .brand {
      position: fixed;
      top: 1.5rem;
      right: 1.6rem;
      z-index: 2;
      display: grid;
      width: 5.8rem;
      height: 2.9rem;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(8, 24, 29, 0.72);
      backdrop-filter: blur(12px);
    }

    .brand img { width: 3.9rem; height: auto; }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100svh;
      place-items: center;
      padding: 5rem 1.5rem 3rem;
    }

    .closing { width: min(100%, 52rem); text-align: center; }

    .bulb-wrap {
      position: relative;
      width: clamp(7.5rem, 15vw, 10.5rem);
      margin: 0 auto 2.6rem;
    }

    .bulb-wrap::before {
      position: absolute;
      inset: -55%;
      z-index: -1;
      border-radius: 50%;
      content: "";
      background: radial-gradient(circle, rgba(246, 203, 105, 0.24), rgba(246, 203, 105, 0.06) 38%, transparent 70%);
      filter: blur(8px);
      animation: halo 4.5s ease-in-out infinite;
    }

    .bulb-wrap img {
      display: block;
      width: 100%;
      height: auto;
      filter: sepia(1) saturate(1.18) drop-shadow(0 0 22px rgba(246, 203, 105, 0.55));
      opacity: 0.94;
      animation: bulb-flicker 7s steps(1, end) infinite;
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--light);
      font-family: "Sora", Helvetica, Arial, sans-serif;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--paper);
      font-family: "Sora", Helvetica, Arial, sans-serif;
      font-size: clamp(2.6rem, 7vw, 5.8rem);
      font-weight: 600;
      letter-spacing: -0.055em;
      line-height: 1.02;
    }

    .thanks {
      max-width: 34rem;
      margin: 1.5rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.22rem);
      line-height: 1.55;
    }

    .next-year {
      width: max-content;
      max-width: 100%;
      margin: 2.5rem auto 0;
      color: var(--light-pale);
      font-family: "Sora", Helvetica, Arial, sans-serif;
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 600;
    }

    .next-year::after {
      display: block;
      width: 4.5rem;
      height: 2px;
      margin: 1.35rem auto 0;
      content: "";
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      box-shadow: 0 0 14px rgba(220, 38, 63, 0.52);
    }

    @keyframes room-breathe { 0%, 100% { opacity: 0.82; } 50% { opacity: 1; } }
    @keyframes halo { 0%, 100% { opacity: 0.62; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes bulb-flicker { 0%, 92%, 94%, 96%, 100% { opacity: 0.94; } 93%, 95% { opacity: 0.55; } }

    @media (max-width: 600px) {
      .brand { top: 1rem; right: 1rem; }
      .bulb-wrap { margin-bottom: 2rem; }
      .thanks { max-width: 25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="brand" aria-label="RGIS"><img src="assets/rgis-white.png" alt="RGIS"></div>
  <main>
    <section class="closing" aria-labelledby="closing-title">
      <div class="bulb-wrap" aria-hidden="true"><img src="assets/welearn-lit.png" alt=""></div>
      <p class="eyebrow">WeLearn · Year One</p>
      <h1 id="closing-title">The event has ended.</h1>
      <p class="thanks">Thank you for celebrating WeLearn's first birthday with us.</p>
      <p class="next-year">See you next year.</p>
    </section>
  </main>
</body>
</html>
